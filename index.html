<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kevin Uehara | Dev.to Semantic Search (Gemma 2 + WebGPU)</title>
    <style>
      :root {
        --bg: #0b0f19;
        --card-bg: #141b2d;
        --border: #1f2a44;
        --accent: #38bdf8;
        --accent-green: #34d399;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --tag-bg: #1e293b;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        background-color: var(--bg);
        color: var(--text);
        padding: 2rem 1.5rem;
        max-width: 1100px;
        margin: 0 auto;
      }
      header {
        margin-bottom: 1.5rem;
        text-align: center;
      }
      h1 {
        font-size: 2.1rem;
        margin-bottom: 0.4rem;
        background: linear-gradient(90deg, #38bdf8, #818cf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      p.subtitle {
        color: var(--text-muted);
        font-size: 0.95rem;
      }

      .status-container {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1.2rem;
        margin-bottom: 1.5rem;
      }
      .status-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.75rem;
        font-size: 0.9rem;
      }
      .status-indicator {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #eab308;
        box-shadow: 0 0 8px #eab308;
      }
      .dot.ready {
        background: var(--accent-green);
        box-shadow: 0 0 8px var(--accent-green);
      }
      .progress-bar-bg {
        width: 100%;
        height: 8px;
        background: #1e293b;
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 0.5rem;
      }
      .progress-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--accent), var(--accent-green));
        transition: width 0.3s ease;
      }
      .status-detail {
        font-size: 0.8rem;
        color: var(--text-muted);
        font-family: monospace;
      }
      .badges {
        display: flex;
        gap: 0.5rem;
      }
      .badge {
        padding: 0.2rem 0.5rem;
        border-radius: 4px;
        font-size: 0.75rem;
        font-weight: 600;
        background: #1e293b;
        border: 1px solid var(--border);
        color: var(--accent);
      }

      .search-box-wrapper {
        margin-bottom: 1.25rem;
      }
      .search-bar {
        width: 100%;
        padding: 1.1rem 1.25rem;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-size: 1.05rem;
        outline: none;
        transition: border-color 0.2s;
      }
      .search-bar:focus {
        border-color: var(--accent);
      }
      .search-bar:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .test-chips {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-bottom: 1.75rem;
        align-items: center;
        font-size: 0.85rem;
        color: var(--text-muted);
      }
      .chip {
        background: var(--card-bg);
        border: 1px solid var(--border);
        padding: 0.35rem 0.75rem;
        border-radius: 20px;
        cursor: pointer;
        color: var(--text);
        transition: all 0.2s;
      }
      .chip:hover {
        border-color: var(--accent);
        background: #1f2a44;
        color: var(--accent);
      }

      .article-list {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .article-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1.25rem;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1.5rem;
        text-decoration: none;
        color: inherit;
        transition:
          transform 0.2s,
          border-color 0.2s;
      }
      .article-card:hover {
        border-color: var(--accent);
      }
      .article-card.top-match {
        border-color: var(--accent);
        background: linear-gradient(180deg, #18233c 0%, #141b2d 100%);
        box-shadow: 0 0 16px rgba(56, 189, 248, 0.25);
        transform: translateY(-2px);
      }
      .article-main {
        flex: 1;
      }
      .article-title {
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 0.4rem;
        color: var(--text);
      }
      .article-card.top-match .article-title {
        color: var(--accent);
      }
      .article-desc {
        font-size: 0.88rem;
        color: var(--text-muted);
        line-height: 1.45;
        margin-bottom: 0.65rem;
      }
      .article-tags {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
      }
      .tag {
        font-size: 0.75rem;
        background: var(--tag-bg);
        padding: 0.15rem 0.5rem;
        border-radius: 4px;
        color: var(--text-muted);
        border: 1px solid var(--border);
      }
      .score-badge {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        min-width: 80px;
      }
      .score-value {
        font-size: 1.35rem;
        font-weight: 700;
        color: var(--accent);
        font-family: monospace;
      }
      .score-label {
        font-size: 0.7rem;
        color: var(--text-muted);
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Kevin Uehara | Dev.to Smart Search</h1>
      <p class="subtitle">
        Client-Side Zero-Keyword Semantic Search using Embedding Gemma 2
        (WebGPU)
      </p>
    </header>

    <div class="status-container">
      <div class="status-header">
        <div class="status-indicator">
          <span class="dot" id="status-dot"></span>
          <strong id="status-title">Initializing...</strong>
        </div>
        <div class="badges">
          <span class="badge" id="backend-badge">WebGPU: Checking</span>
          <span class="badge" id="latency-badge">Latency: --</span>
        </div>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="status-detail" id="status-detail">
        Preparing local models...
      </div>
    </div>

    <div class="search-box-wrapper">
      <input
        type="text"
        id="search-input"
        class="search-bar"
        placeholder="Loading model and indexing articles into GPU memory..."
        disabled
      />
    </div>

    <div class="test-chips">
      <span>💡 Zero-keyword demo prompts:</span>
      <span
        class="chip"
        data-q="my web page is super slow and taking forever to render"
        >"slow page performance"</span
      >
      <span
        class="chip"
        data-q="running heavy scripts in background without freezing the ui"
        >"heavy background jobs"</span
      >
      <span
        class="chip"
        data-q="how to stop duplicating code and keep architecture maintainable"
        >"code simplicity"</span
      >
      <span
        class="chip"
        data-q="connecting machine learning models to client side browser tools"
        >"native browser ai"</span
      >
    </div>

    <main class="article-list" id="article-list"></main>

    <script type="module">
      import {
        EmbeddingEngine,
        Backend,
      } from "https://cdn.jsdelivr.net/npm/@litert-lm/core/+esm";

      const articles = [
        {
          id: 1,
          title: "WebMCP and WebAI: Exploring native AI tools in Chrome",
          description:
            "Hands-on exploration of native artificial intelligence features, client-side inference, and local models directly running inside Chrome.",
          tags: ["webdev", "ai", "javascript"],
          url: "https://dev.to/kevin-uehara",
          embedding: null,
        },
        {
          id: 2,
          title: "Building Your First MCP Server: A Beginner's Guide",
          description:
            "Step-by-step practical guide to constructing and configuring Model Context Protocol servers to connect contextual tools with AI models.",
          tags: ["mcp", "typescript", "ai"],
          url: "https://dev.to/kevin-uehara",
          embedding: null,
        },
        {
          id: 3,
          title: "Chrome DevTools: Everything You Need to Know",
          description:
            "In-depth breakdown of Web Vitals metrics, runtime rendering optimization, Cache Storage, IndexedDB inspection, and code debugging.",
          tags: ["performance", "devtools", "webvitals"],
          url: "https://dev.to/kevin-uehara/chrome-devtools-everything-you-need-to-know-51pk",
          embedding: null,
        },
        {
          id: 4,
          title: "SOLID - The Simple Way To Understand",
          description:
            "Clear TypeScript examples explaining the five core object-oriented software engineering principles, dependency inversion, and separation of concerns.",
          tags: ["solid", "typescript", "architecture"],
          url: "https://dev.to/kevin-uehara/solid-the-simple-way-to-understand-47im",
          embedding: null,
        },
        {
          id: 5,
          title: "DRY, KISS and YAGNI - Make Your Code Simple",
          description:
            "Pragmatic software engineering principles to eliminate redundancy, avoid over-engineering, and keep codebase architecture lean.",
          tags: ["cleancode", "bestpractices", "javascript"],
          url: "https://dev.to/kevin-uehara/dry-kiss-and-yagni-make-your-code-simple-1dmd",
          embedding: null,
        },
        {
          id: 6,
          title: "Introducing Javascript Web Workers",
          description:
            "How to offload CPU-intensive computations to dedicated background threads without blocking the main thread or causing UI jank.",
          tags: ["javascript", "webworkers", "performance"],
          url: "https://dev.to/kevin-uehara",
          embedding: null,
        },
        {
          id: 7,
          title:
            "Understading Algorithm Complexity: A Deep Dive into Big O Notation",
          description:
            "Time and space complexity fundamentals explained with real-world JavaScript code benchmarks and algorithmic analysis.",
          tags: ["algorithms", "javascript", "computerscience"],
          url: "https://dev.to/kevin-uehara",
          embedding: null,
        },
        {
          id: 8,
          title: "Mocking Your API's Calls Using Mocking Service Worker (MSW)",
          description:
            "Intercept and simulate HTTP network requests at the Service Worker level for robust offline testing and frontend isolation.",
          tags: ["msw", "testing", "javascript"],
          url: "https://dev.to/kevin-uehara",
          embedding: null,
        },
      ];

      let engine = null;

      const statusDot = document.getElementById("status-dot");
      const statusTitle = document.getElementById("status-title");
      const statusDetail = document.getElementById("status-detail");
      const progressFill = document.getElementById("progress-fill");
      const backendBadge = document.getElementById("backend-badge");
      const latencyBadge = document.getElementById("latency-badge");
      const searchInput = document.getElementById("search-input");
      const articleList = document.getElementById("article-list");

      function updateStatus(title, detail, progressPct) {
        statusTitle.textContent = title;
        statusDetail.textContent = detail;
        if (progressPct !== undefined) {
          progressFill.style.width = `${progressPct}%`;
        }
      }

      function extractVector(res) {
        if (!res) return null;
        if (Array.isArray(res) || res instanceof Float32Array) return res;
        if (res.values) return extractVector(res.values);
        if (res.floatEmbedding) return res.floatEmbedding;
        if (res.embedding) return extractVector(res.embedding);
        if (res.embeddings && res.embeddings[0])
          return extractVector(res.embeddings[0]);
        for (const k of Object.keys(res)) {
          if (Array.isArray(res[k]) || res[k] instanceof Float32Array)
            return res[k];
        }
        return null;
      }

      function cosineSimilarity(vecA, vecB) {
        if (!vecA || !vecB) return 0;
        let dot = 0,
          normA = 0,
          normB = 0;
        const len = Math.min(vecA.length, vecB.length);
        for (let i = 0; i < len; i++) {
          dot += vecA[i] * vecB[i];
          normA += vecA[i] * vecA[i];
          normB += vecB[i] * vecB[i];
        }
        const denom = Math.sqrt(normA) * Math.sqrt(normB);
        return denom === 0 ? 0 : dot / denom;
      }

      function renderArticles(items, scores = {}) {
        articleList.innerHTML = "";
        const hasScores = Object.keys(scores).length > 0;

        items.forEach((item, index) => {
          const isTop = index === 0 && hasScores;
          const scoreDisplay =
            hasScores && scores[item.id] !== undefined
              ? `${(scores[item.id] * 100).toFixed(1)}%`
              : "--";

          const card = document.createElement("a");
          card.href = item.url;
          card.target = "_blank";
          card.className = `article-card ${isTop ? "top-match" : ""}`;
          card.innerHTML = `
          <div class="article-main">
            <h3 class="article-title">${item.title}</h3>
            <p class="article-desc">${item.description}</p>
            <div class="article-tags">
              ${item.tags.map((t) => `<span class="tag">#${t}</span>`).join("")}
            </div>
          </div>
          <div class="score-badge">
            <span class="score-value">${scoreDisplay}</span>
            <span class="score-label">Similarity</span>
          </div>
        `;
          articleList.appendChild(card);
        });
      }

      async function init() {
        renderArticles(articles);

        try {
          updateStatus("Loading model...", "Allocating WebGPU buffers...", 15);
          backendBadge.textContent = "WebGPU: Allocating";

          engine = await EmbeddingEngine.create({
            model:
              "https://pub-6262d52f8235473686b7bd4ad060cfcd.r2.dev/embeddinggemma-2-text-vision-440m.litertlm",
            backend: Backend && Backend.GPU !== undefined ? Backend.GPU : "gpu",
          });

          backendBadge.textContent = "WebGPU: Active";
          updateStatus(
            "Model ready",
            "Indexing kevin-uehara articles on GPU...",
            30,
          );

          for (let i = 0; i < articles.length; i++) {
            const currentPct =
              30 + Math.round(((i + 1) / articles.length) * 65);
            updateStatus(
              `Indexing article ${i + 1}/${articles.length}...`,
              `Vectorizing: "${articles[i].title}"...`,
              currentPct,
            );

            const docContent = `title: ${articles[i].title} | content: ${articles[i].description}`;
            const res = await engine.computeEmbedding(docContent, {
              normalize: true,
            });
            articles[i].embedding = extractVector(res);
          }

          updateStatus(
            "Ready for local search",
            `${articles.length} articles indexed 100% offline in GPU memory.`,
            100,
          );
          statusDot.classList.add("ready");
          searchInput.disabled = false;
          searchInput.placeholder =
            'Type any technical question (e.g., "how to run scripts without freezing the UI")...';
          searchInput.focus();
        } catch (err) {
          console.error(err);
          statusDot.style.background = "#ef4444";
          statusDot.style.boxShadow = "0 0 8px #ef4444";
          updateStatus("Initialization error", err.message, 0);
        }
      }

      async function runSearch(query) {
        const q = query.trim();
        if (!q || !engine) return;

        const t0 = performance.now();

        const formattedQuery = `task: search query | text: ${q}`;
        const textRes = await engine.computeEmbedding(formattedQuery, {
          normalize: true,
        });
        const queryVec = extractVector(textRes);

        const scores = {};
        const ranked = [...articles].sort((a, b) => {
          const scoreA = cosineSimilarity(queryVec, a.embedding);
          const scoreB = cosineSimilarity(queryVec, b.embedding);
          scores[a.id] = scoreA;
          scores[b.id] = scoreB;
          return scoreB - scoreA;
        });

        const latency = (performance.now() - t0).toFixed(1);
        latencyBadge.textContent = `Latency: ${latency}ms`;

        renderArticles(ranked, scores);
      }

      let debounceTimer;
      searchInput.addEventListener("input", (e) => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => runSearch(e.target.value), 180);
      });

      document.querySelectorAll(".chip").forEach((chip) => {
        chip.addEventListener("click", () => {
          if (searchInput.disabled) return;
          searchInput.value = chip.dataset.q;
          runSearch(chip.dataset.q);
        });
      });

      init();
    </script>
  </body>
</html>
